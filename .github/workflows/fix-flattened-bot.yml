name: Fix Flattened Bot Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move bot startup to the end
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('bot.py')
          text = p.read_text(encoding='utf-8')

          text = re.sub(
              r'\nif __name__ == ["\']__main__["\']:\n\s*bot\.run\(TOKEN\)\s*\n',
              '\n',
              text,
          )

          text = re.sub(r'\nVerifyView = QuestionVerifyView\s*$', '', text)
          text = text.rstrip() + '\n\nVerifyView = QuestionVerifyView\n\nif __name__ == "__main__":\n    bot.run(TOKEN)\n'
          p.write_text(text, encoding='utf-8')

          trigger = Path('.github/flatten-trigger.txt')
          if trigger.exists():
              trigger.unlink()

          workflow = Path('.github/workflows/fix-flattened-bot.yml')
          if workflow.exists():
              workflow.unlink()
      - name: Check syntax
        run: python -m py_compile bot.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix flattened bot startup order'
          git push
