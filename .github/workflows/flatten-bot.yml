name: Flatten Python Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge Python modules into bot.py
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          bot = root / 'bot.py'
          sources = [root / 'rm_plus.py', root / 'rm_ui.py', root / 'rm_verify.py']

          if not bot.exists() or not all(p.exists() for p in sources):
              print('Nothing to flatten; source modules are already gone.')
              raise SystemExit(0)

          merged = bot.read_text(encoding='utf-8').rstrip() + '\n\n'

          plus = (root / 'rm_plus.py').read_text(encoding='utf-8')
          plus = re.sub(
              r'from bot import \(.*?\n\)\n\n',
              '',
              plus,
              flags=re.S,
          )
          merged += '\n# ==================== RM PLUS ====================\n\n' + plus.strip() + '\n\n'

          ui = (root / 'rm_ui.py').read_text(encoding='utf-8')
          ui = re.sub(r'from bot import .*?\n', '', ui)
          ui = re.sub(r'from rm_plus import .*?\n', '', ui)
          merged += '\n# ==================== RM UI ====================\n\n' + ui.strip() + '\n\n'

          verify = (root / 'rm_verify.py').read_text(encoding='utf-8')
          verify = re.sub(r'from bot import .*?\n', '', verify)
          verify = re.sub(r'from rm_plus import .*?\n', '', verify)
          verify = re.sub(
              r'\n# full_setup resolves VerifyView.*?\nimport rm_plus as _rm_plus\n_rm_plus\.VerifyView = QuestionVerifyView\s*$',
              '',
              verify,
              flags=re.S,
          )
          merged += '\n# ==================== RM VERIFICATION ====================\n\n' + verify.strip() + '\n\n'
          merged += '# Flattened from rm_plus.py, rm_ui.py, and rm_verify.py.\nVerifyView = QuestionVerifyView\n'

          bot.write_text(merged, encoding='utf-8')

          for path in sources + [root / 'main.py', root / 'sitecustomize.py']:
              if path.exists():
                  path.unlink()

          workflow = root / '.github/workflows/flatten-bot.yml'
          if workflow.exists():
              workflow.unlink()

      - name: Check syntax
        run: python -m py_compile bot.py

      - name: Commit flattened bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Merge all Python bot modules into bot.py'
          git push
