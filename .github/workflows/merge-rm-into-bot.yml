        await interaction.response.edit_message(embed=make_embed('📈 Live Server Stats', f'Members `{g.member_count}`\nText `{len(g.text_channels)}`\nVoice `{len(g.voice_channels)}`\nRoles `{len(g.roles)}`\nLatency `{round(bot.latency * 1000)}ms`'), view=self)

    @discord.ui.button(label='Commands', style=discord.ButtonStyle.secondary, row=0)
