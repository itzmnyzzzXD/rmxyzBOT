name: Merge RM into bot.py

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Losslessly merge RM expansion into bot.py
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bot_path = Path('bot.py')
          exp_path = Path('rm_expansion.py')
          bot = bot_path.read_text(encoding='utf-8')
          exp = exp_path.read_text(encoding='utf-8')
          marker = '# === RM EXPANSION MERGED INTO BOT.PY ==='

          if marker not in bot:
              out = []
              for line in exp.splitlines():
                  stripped = line.strip()
                  if stripped.startswith('from __future__ import '):
                      continue
                  if stripped.startswith('from bot import '):
                      out.append('# RM expansion self-import omitted after lossless in-file merge.')
                      out.append('# ' + line)
                      continue
                  out.append(line)
              merged = bot.rstrip() + '\n\n' + marker + '\n' + '\n'.join(out).rstrip() + '\n'
              bot_path.write_text(merged, encoding='utf-8')
              print('RM expansion merged into bot.py without removing source code.')
          else:
              print('RM expansion already merged into bot.py; preserving it.')
          PY

      - name: Add expanded interactive UI layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# === RM EXPANDED INTERACTIVE UI ==='
          if marker in s:
              print('Expanded UI already present.')
              raise SystemExit(0)

          extra = r'''

# === RM EXPANDED INTERACTIVE UI ===
class RMInteractiveBase(discord.ui.View):
    def __init__(self, owner_id: int, timeout: int = 300):
        super().__init__(timeout=timeout)
        self.owner_id = owner_id

    async def interaction_check(self, interaction):
        if interaction.user.id != self.owner_id:
            await interaction.response.send_message('This RM panel belongs to another user.', ephemeral=True)
            return False
        return True


class RMSecurityPanel(RMInteractiveBase):
    def status_embed(self, guild):
        c = get_config(guild.id)
        return make_embed(
            'RM • Security Center',
            f'**Anti-links:** `{bool(c["anti_links"])}`\n'
            f'**Anti-invites:** `{bool(c["anti_invites"])}`\n'
            f'**Anti-spam:** `{bool(c["anti_spam"])}`\n'
            f'**Anti-mentions:** `{bool(c["anti_mentions"])}`\n'
            f'**Anti-caps:** `{bool(c["anti_caps"])}`\n'
            f'**Verification:** `{bool(c["verification_enabled"])}`',
        )

    async def flip(self, interaction, key, label):
        cfg = get_config(interaction.guild.id)
        new_value = 0 if bool(cfg[key]) else 1
        set_config(interaction.guild.id, key, new_value)
        await interaction.response.edit_message(
            embed=self.status_embed(interaction.guild),
            view=self,
        )

    @discord.ui.button(label='Links', style=discord.ButtonStyle.danger, row=0)
    async def links(self, interaction, button):
        await self.flip(interaction, 'anti_links', 'Anti-links')

    @discord.ui.button(label='Invites', style=discord.ButtonStyle.danger, row=0)
    async def invites(self, interaction, button):
        await self.flip(interaction, 'anti_invites', 'Anti-invites')

