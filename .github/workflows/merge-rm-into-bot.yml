    @discord.ui.button(label='Mentions', style=discord.ButtonStyle.danger, row=1)
    async def mentions(self, interaction, button):
        await self.flip(interaction, 'anti_mentions', 'Anti-mentions')

    @discord.ui.button(label='Caps', style=discord.ButtonStyle.secondary, row=1)
    async def caps(self, interaction, button):
        await self.flip(interaction, 'anti_caps', 'Anti-caps')

    @discord.ui.button(label='Verification', style=discord.ButtonStyle.success, row=1)
    async def verification(self, interaction, button):
        await self.flip(interaction, 'verification_enabled', 'Verification')

    @discord.ui.button(label='Refresh', style=discord.ButtonStyle.primary, row=2)
    async def refresh(self, interaction, button):
        await interaction.response.edit_message(embed=self.status_embed(interaction.guild), view=self)

    @discord.ui.button(label='Back', style=discord.ButtonStyle.secondary, row=2)
    async def back(self, interaction, button):
        await interaction.response.edit_message(
            embed=make_embed('RM • Interactive Center', 'Choose a system.'),
            view=RMInteractiveHome(interaction.user.id),
        )


