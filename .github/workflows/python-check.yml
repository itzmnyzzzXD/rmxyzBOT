class RMMemberPanel(RMInteractiveBase):
    @discord.ui.button(label='Profile',style=discord.ButtonStyle.primary,row=0)
    async def profile(self,interaction,button):
        m=interaction.user; e=make_embed(f'👤 {m.display_name}',f'ID `{m.id}`\nTop role {m.top_role.mention}\nJoined {discord.utils.format_dt(m.joined_at,"R") if m.joined_at else "Unknown"}'); e.set_thumbnail(url=m.display_avatar.url); await interaction.response.edit_message(embed=e,view=self)
    @discord.ui.button(label='Warnings',style=discord.ButtonStyle.danger,row=0)
    async def warnings(self,interaction,button):
        conn=db(); rows=conn.execute('SELECT id,reason FROM warnings WHERE guild_id=? AND user_id=? ORDER BY id DESC LIMIT 8',(interaction.guild.id,interaction.user.id)).fetchall(); conn.close(); body='\n'.join(f'`#{r["id"]}` {r["reason"][:100]}' for r in rows) or 'No warnings found.'; await interaction.response.edit_message(embed=make_embed('⚠️ Recent Warnings',body),view=self)
    @discord.ui.button(label='Permissions',style=discord.ButtonStyle.secondary,row=0)
    async def permissions_button(self,interaction,button):
        perms=[n.replace('_',' ').title() for n,v in interaction.user.guild_permissions if v]; await interaction.response.edit_message(embed=make_embed('🔑 Permissions',', '.join(perms)[:3900] or 'None'),view=self)
    @discord.ui.button(label='Avatar',style=discord.ButtonStyle.secondary,row=1)
    async def avatar_button(self,interaction,button):
        e=make_embed(f'🖼️ {interaction.user.display_name}',f'[Open PNG]({interaction.user.display_avatar.with_format("png").url})'); e.set_image(url=interaction.user.display_avatar.url); await interaction.response.edit_message(embed=e,view=self)
    @discord.ui.button(label='Back',style=discord.ButtonStyle.secondary,row=2)
    async def back(self,interaction,button): await interaction.response.edit_message(embed=make_embed('RM • Interactive Center','Choose a system.'),view=RMInteractiveHome(interaction.user.id))

class RMUtilityPanel(RMInteractiveBase):
    @discord.ui.button(label='Live Stats',style=discord.ButtonStyle.primary,row=0)
    async def stats(self,interaction,button):
        g=interaction.guild; await interaction.response.edit_message(embed=make_embed('📈 Live Server Stats',f'Members `{g.member_count}`\nText `{len(g.text_channels)}`\nVoice `{len(g.voice_channels)}`\nRoles `{len(g.roles)}`\nLatency `{round(bot.latency*1000)}ms`'),view=self)
    @discord.ui.button(label='Commands',style=discord.ButtonStyle.secondary,row=0)
    async def commands_button(self,interaction,button):
        names=sorted({c.qualified_name for c in bot.walk_commands()}); await interaction.response.edit_message(embed=make_embed('⌨️ Loaded Commands','\n'.join(f'`{n}`' for n in names[:90]) or 'No commands loaded.'),view=self)
    @discord.ui.button(label='Server Info',style=discord.ButtonStyle.secondary,row=1)
    async def server_info(self,interaction,button):
        g=interaction.guild; await interaction.response.edit_message(embed=make_embed(f'🏰 {g.name}',f'Owner <@{g.owner_id}>\nCreated {discord.utils.format_dt(g.created_at,"F")}\nBoosts `{g.premium_subscription_count}`'),view=self)
    @discord.ui.button(label='Refresh',style=discord.ButtonStyle.success,row=1)
    async def refresh(self,interaction,button): await interaction.response.edit_message(embed=make_embed('🟢 RM Live',f'Latency `{round(bot.latency*1000)}ms`\nGuilds `{len(bot.guilds)}`\nCached users `{len(bot.users)}`'),view=self)
