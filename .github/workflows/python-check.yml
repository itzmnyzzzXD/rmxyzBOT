name: Python Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Losslessly merge RM expansion into bot.py
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          bot_path = Path('bot.py')
          exp_path = Path('rm_expansion.py')
          bot = bot_path.read_text(encoding='utf-8')
          exp = exp_path.read_text(encoding='utf-8')
          marker = '# === RM EXPANSION MERGED INTO BOT.PY ==='
          if marker not in bot:
              lines = exp.splitlines()
              merged = []
              found_import = False
              for line in lines:
                  if line.startswith('from bot import '):
                      merged.append('# Original rm_expansion import retained as disabled provenance.')
                      merged.append(f'# {line}')
                      merged.append('if False:')
                      merged.append('    ' + line)
                      found_import = True
                  else:
                      merged.append(line)
              if not found_import:
                  raise SystemExit('Refusing to merge because the expansion source import was not found.')
              bot += '\n\n' + marker + '\n' + '\n'.join(merged) + '\n'
              bot_path.write_text(bot, encoding='utf-8')
              print('RM expansion merged into bot.py')
          else:
              print('RM expansion already present in bot.py')
          PY
      - name: Validate integrated runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bot.py rm_expansion.py main.py
          DISCORD_TOKEN=dummy DISCORD_BOT_TOKEN=dummy python - <<'PY'
          import bot
          names = [c.qualified_name for c in bot.bot.walk_commands()]
          dupes = sorted({n for n in names if names.count(n) > 1})
          assert not dupes, f'Duplicate command names: {dupes}'
          print(f'Loaded {len(names)} commands with no duplicate qualified names.')
          PY
      - name: Commit integrated bot.py
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then
            echo 'No integration commit needed.'
          else
            git commit -m 'Merge RM expansion into bot.py'
            git push
          fi
