    async def back(self,interaction,button): await interaction.response.edit_message(embed=make_embed('RM • Interactive Center','Choose a system.'),view=RMInteractiveHome(interaction.user.id))

class RMInteractiveHome(RMInteractiveBase):
    @discord.ui.button(label='Security',style=discord.ButtonStyle.danger,emoji='🔐',row=0)
    async def security(self,interaction,button):
        v=RMSecurityPanel(interaction.user.id); await interaction.response.edit_message(embed=v.status_embed(interaction.guild),view=v)
    @discord.ui.button(label='Server Setup',style=discord.ButtonStyle.primary,emoji='⚙️',row=0)
    async def setup(self,interaction,button):
        v=RMSetupPanel(interaction.user.id); await interaction.response.edit_message(embed=v.status_embed(interaction.guild),view=v)
    @discord.ui.button(label='Member',style=discord.ButtonStyle.success,emoji='👤',row=0)
