name: RM Bot Python Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  merge-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Merge RM expansion into bot.py
        run: python .github/scripts/merge_rm_expansion.py

      - name: Validate all Python files
        env:
          DISCORD_TOKEN: dummy
          DISCORD_BOT_TOKEN: dummy
        run: |
          python -m py_compile bot.py main.py rm_expansion.py
          python - <<'PY'
          import bot
          names = [cmd.qualified_name for cmd in bot.bot.walk_commands()]
          duplicates = sorted({name for name in names if names.count(name) > 1})
          if duplicates:
              raise SystemExit(f"Duplicate command names after merge: {duplicates}")
          print(f"Validated bot.py with {len(names)} commands and no duplicate qualified names.")
          PY

      - name: Commit merged bot.py
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "bot.py was already up to date."
          else
            git commit -m "Merge RM expansion fully into bot.py"
            git pull --rebase origin main
            git push origin main
          fi
