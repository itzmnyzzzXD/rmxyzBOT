    async def health(self,interaction,button): await interaction.response.edit_message(embed=make_embed('RM • Health',f'Latency `{round(bot.latency*1000)}ms`\nGuilds `{len(bot.guilds)}`\nCached users `{len(bot.users)}`'),view=self)

@bot.hybrid_command(name='rmpanel',description='Open the expanded RM interactive control center.')
async def rm_panel(ctx):
    msg=await ctx.reply(embed=make_embed('RM • Loading','▰▱▱▱▱\nBuilding interactive control center…'))
    for i,step in enumerate(('Loading security','Loading server systems','Loading member tools','Loading utilities','Ready'),1):
        await asyncio.sleep(0.12); await msg.edit(embed=make_embed('RM • Loading',f'{progress_bar(i,5)}\n{step}'))
    await msg.edit(embed=make_embed('RM • Interactive Center','Everything important is one click away.'),view=RMInteractiveHome(ctx.author.id))
'''
          p.write_text(s.rstrip() + extra + '\n', encoding='utf-8')
          print('Expanded interactive UI added.')
          PY
      - name: Validate Python runtime and commands
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bot.py main.py rm_expansion.py
          DISCORD_TOKEN=dummy DISCORD_BOT_TOKEN=dummy python - <<'PY'
          import bot
          names = [c.qualified_name for c in bot.bot.walk_commands()]
          dupes = sorted({n for n in names if names.count(n) > 1})
          assert not dupes, f'Duplicate commands: {dupes}'
          assert 'rmpanel' in names, 'rmpanel was not registered'
          print(f'Validated {len(names)} commands with no duplicate qualified names.')
          PY
      - name: Push merged bot.py when changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then
            echo 'No bot.py changes needed.'
          else
            git commit -m 'Merge RM expansion and expand interactive UI into bot.py'
            git push
          fi
