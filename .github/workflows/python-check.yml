name: Python Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Merge RM expansion into bot.py without dropping source lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          bot_path = Path('bot.py')
          expansion_path = Path('rm_expansion.py')
          bot = bot_path.read_text(encoding='utf-8')
          expansion = expansion_path.read_text(encoding='utf-8')
          marker = '# === RM EXPANSION MERGED INTO BOT.PY ==='
          if marker not in bot:
              out = []
              for line in expansion.splitlines():
                  stripped = line.strip()
                  if stripped.startswith('from __future__ import '):
                      continue
                  if stripped.startswith('from bot import '):
                      out.append('# RM expansion self-import retained as provenance only after in-file merge.')
                      out.append('# ' + line)
                      continue
                  out.append(line)
              bot = bot.rstrip() + '\n\n' + marker + '\n' + '\n'.join(out).rstrip() + '\n'
              bot_path.write_text(bot, encoding='utf-8')
              print('RM expansion merged into bot.py.')
          else:
              print('RM expansion already merged; preserving bot.py.')
          PY
      - name: Add extra interactive RM UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# === RM EXPANDED INTERACTIVE UI ==='
          if marker in s:
              print('Extra interactive UI already present.')
              raise SystemExit(0)
          extra = r'''

# === RM EXPANDED INTERACTIVE UI ===
class RMInteractiveBase(discord.ui.View):
    def __init__(self, owner_id: int, timeout: int = 300):
        super().__init__(timeout=timeout)
        self.owner_id = owner_id
    async def interaction_check(self, interaction):
        if interaction.user.id != self.owner_id:
            await interaction.response.send_message('This RM panel belongs to another user.', ephemeral=True)
            return False
        return True

class RMSecurityPanel(RMInteractiveBase):
    def status_embed(self, guild):
        c=get_config(guild.id)
        return make_embed('RM • Security Center',f'**Links:** `{bool(c["anti_links"])}`\n**Invites:** `{bool(c["anti_invites"])}`\n**Spam:** `{bool(c["anti_spam"])}`\n**Mentions:** `{bool(c["anti_mentions"])}`\n**Caps:** `{bool(c["anti_caps"])}`\n**Verification:** `{bool(c["verification_enabled"])}`')
    async def flip(self, interaction, key):
        cfg=get_config(interaction.guild.id); set_config(interaction.guild.id,key,0 if bool(cfg[key]) else 1); await interaction.response.edit_message(embed=self.status_embed(interaction.guild),view=self)
    @discord.ui.button(label='Links',style=discord.ButtonStyle.danger,row=0)
    async def links(self,interaction,button): await self.flip(interaction,'anti_links')
    @discord.ui.button(label='Invites',style=discord.ButtonStyle.danger,row=0)
    async def invites(self,interaction,button): await self.flip(interaction,'anti_invites')
    @discord.ui.button(label='Spam',style=discord.ButtonStyle.danger,row=0)
    async def spam(self,interaction,button): await self.flip(interaction,'anti_spam')
    @discord.ui.button(label='Mentions',style=discord.ButtonStyle.danger,row=1)
    async def mentions(self,interaction,button): await self.flip(interaction,'anti_mentions')
    @discord.ui.button(label='Caps',style=discord.ButtonStyle.secondary,row=1)
    async def caps(self,interaction,button): await self.flip(interaction,'anti_caps')
    @discord.ui.button(label='Verification',style=discord.ButtonStyle.success,row=1)
    async def verification(self,interaction,button): await self.flip(interaction,'verification_enabled')
    @discord.ui.button(label='Refresh',style=discord.ButtonStyle.primary,row=2)
    async def refresh(self,interaction,button): await interaction.response.edit_message(embed=self.status_embed(interaction.guild),view=self)
    @discord.ui.button(label='Back',style=discord.ButtonStyle.secondary,row=2)
    async def back(self,interaction,button): await interaction.response.edit_message(embed=make_embed('RM • Interactive Center','Choose a system.'),view=RMInteractiveHome(interaction.user.id))

