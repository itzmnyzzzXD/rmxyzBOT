@bot.hybrid_command(name='rm', description='Open the full RM interactive control center.')
async def rm_super(ctx):
    await ctx.reply(embed=make_embed('RM • Super Panel', 'A full interactive control center for RM. Pick a section.'), view=RMNavView(ctx.author.id))


@bot.hybrid_command(name='rmhelp', description='Open the interactive categorized help browser.')
async def rm_help(ctx):
    names = sorted({c.qualified_name for c in bot.walk_commands()})
    desc = 'Use the RM panel buttons to browse tools.\n\n' + '\n'.join(f'• `{n}`' for n in names[:90])
    await ctx.reply(embed=make_embed('RM • Command Browser', desc[:4000]), view=RMNavView(ctx.author.id))


@bot.hybrid_command(name='rmhealth', description='Show live RM health and runtime information.')
async def rm_health(ctx):
