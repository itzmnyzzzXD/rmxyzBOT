name: Integrate RM expansion into bot.py

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/merge-expansion-into-bot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge expansion without dropping source code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bot_path = Path('bot.py')
          expansion_path = Path('rm_expansion.py')
          bot = bot_path.read_text(encoding='utf-8')
          expansion = expansion_path.read_text(encoding='utf-8')
          marker = '# === RM EXPANSION MERGED INTO BOT.PY ==='

          if marker not in bot:
              lines = expansion.splitlines()
              out = []
              import_replaced = False
              for line in lines:
                  if line.startswith('from bot import '):
                      out.append('# Original rm_expansion import retained as a disabled provenance line after merge.')
                      out.append(f'# {line}')
                      out.append('if False:')
                      out.append('    ' + line)
                      import_replaced = True
                  else:
                      out.append(line)
              if not import_replaced:
                  raise SystemExit('Could not find the expansion bot import; refusing to make a lossy merge.')

              merged = bot.rstrip() + '\n\n' + marker + '\n' + '\n'.join(out).rstrip() + '\n'
              bot_path.write_text(merged, encoding='utf-8')
              print('Merged rm_expansion.py into bot.py')
          else:
              print('Expansion already merged; preserving existing bot.py')
          PY

      - name: Add RM interactive super-panel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = '# === RM INTERACTIVE SUPER PANEL ==='
          if marker in s:
              print('Super panel already present')
              raise SystemExit(0)
          extra = r'''

# === RM INTERACTIVE SUPER PANEL ===
class RMNavView(discord.ui.View):
    def __init__(self, owner_id: int):
        super().__init__(timeout=300)
        self.owner_id = owner_id

    async def interaction_check(self, interaction):
        if interaction.user.id != self.owner_id:
            await interaction.response.send_message('This panel belongs to another user.', ephemeral=True)
            return False
        return True

    @discord.ui.button(label='Overview', style=discord.ButtonStyle.primary, emoji='🏠')
    async def overview(self, interaction, button):
        g = interaction.guild
        e = make_embed('RM • Overview', f'**{g.name}**\nMembers: `{g.member_count}`\nChannels: `{len(g.channels)}`\nRoles: `{len(g.roles)}`\nLatency: `{round(bot.latency * 1000)}ms`')
        await interaction.response.edit_message(embed=e, view=self)

    @discord.ui.button(label='Moderation', style=discord.ButtonStyle.danger, emoji='🛡️')
    async def moderation(self, interaction, button):
        await interaction.response.edit_message(embed=make_embed('RM • Moderation', 'Use the dedicated moderation workflows below or jump back home.'), view=RMModView(interaction.user.id))

    @discord.ui.button(label='Server', style=discord.ButtonStyle.secondary, emoji='⚙️')
    async def server(self, interaction, button):
        await interaction.response.edit_message(embed=make_embed('RM • Server Tools', 'Configuration, security, logs, welcome, verification, tickets and roles.'), view=RMServerView(interaction.user.id))

    @discord.ui.button(label='Member', style=discord.ButtonStyle.success, emoji='👤')
    async def member(self, interaction, button):
        await interaction.response.edit_message(embed=make_embed('RM • Member Tools', 'Profiles, permissions, avatar/banner, warnings and moderation actions.'), view=RMMemberView(interaction.user.id))

    @discord.ui.button(label='Utilities', style=discord.ButtonStyle.secondary, emoji='🧰')
    async def utilities(self, interaction, button):
        await interaction.response.edit_message(embed=make_embed('RM • Utilities', 'Embeds, polls, reminders, slowmode, purge, stats and help.'), view=RMUtilView(interaction.user.id))


