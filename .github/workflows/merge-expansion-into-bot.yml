class RMMemberView(RMNavView):
    @discord.ui.button(label='Back', style=discord.ButtonStyle.secondary, row=1, emoji='↩️')
    async def back(self, interaction, button):
        await interaction.response.edit_message(embed=make_embed('RM • Super Panel', 'Pick a section.'), view=RMNavView(interaction.user.id))

    @discord.ui.button(label='My Profile', style=discord.ButtonStyle.primary, row=1, emoji='👤')
    async def me2(self, interaction, button):
        m = interaction.user
        await interaction.response.edit_message(embed=make_embed(f'👤 {m.display_name}', f'ID `{m.id}`\nJoined {discord.utils.format_dt(m.joined_at, "R") if m.joined_at else "Unknown"}\nTop role: {m.top_role.mention}'), view=self)

