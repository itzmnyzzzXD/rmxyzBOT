        await interaction.response.edit_message(embed=make_embed('🔑 Your Permissions', ', '.join(perms)[:3900] or 'None'), view=self)

    @discord.ui.button(label='Warnings', style=discord.ButtonStyle.danger, row=2, emoji='⚠️')
    async def warns2(self, interaction, button):
        conn = db()
        rows = conn.execute('SELECT id, reason, created_at FROM warnings WHERE guild_id=? AND user_id=? ORDER BY id DESC LIMIT 10', (interaction.guild.id, interaction.user.id)).fetchall()
        conn.close()
        body = '\n'.join(f'`#{r["id"]}` {r["reason"][:90]}' for r in rows) or 'No warnings.'
        await interaction.response.edit_message(embed=make_embed('⚠️ Your Recent Warnings', body), view=self)


