        e.set_image(url=interaction.user.display_avatar.url)
        await interaction.response.edit_message(embed=e, view=self)

    @discord.ui.button(label='Permissions', style=discord.ButtonStyle.secondary, row=2, emoji='🔑')
    async def perms2(self, interaction, button):
